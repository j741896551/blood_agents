[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-blood-donation-agents"
version = "0.1.0"
description = "A LangChain + LangGraph multi-agent blood donation assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langchain>=0.3,<1",
  "langchain-openai>=0.3,<1",
  "langgraph>=0.6,<1",
  # Gradio 5.50 与 MCP 共用的已验证 Pydantic 2.12 系列。
  "pydantic>=2.12,<2.12.4",
  "python-dotenv>=1,<2",
  # 业务服务适配层使用独立 HTTP 客户端，不依赖模型 SDK 的传递依赖。
  "httpx>=0.27,<1",
  # Agent 自有表和独立的 LangGraph SQLite checkpoint 均使用 SQLAlchemy。
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
ui = ["gradio==5.50.0", "huggingface-hub>=0.25,<1"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "langgraph-checkpoint-sqlite==3.0.3"]
mcp = ["mcp>=2.3,<2.4"]
rag = [
  "sentence-transformers>=3,<5",
  "transformers>=4.45,<5",
  "huggingface-hub>=0.25,<1",
  "faiss-cpu>=1.8,<2",
  "pymilvus[milvus-lite]>=2.4,<3",
]
rag_ingest = ["pypdf>=4,<7"]
ocr = ["pillow>=10,<12", "pytesseract>=0.3,<1"]
train = ["datasets>=3,<5", "peft>=0.13,<1", "transformers>=4.45,<5"]

[project.scripts]
blood-agent = "blood_agents.cli:main"
blood-agent-eval = "blood_agents.evals.evaluation:main"
blood-agent-dialogue-eval = "blood_agents.evals.conversation_evaluation:main"
blood-agent-web = "blood_agents.web:main"

[tool.setuptools.packages.find]
include = ["blood_agents*"]

[tool.setuptools.package-data]
"blood_agents.knowledge" = ["corpus.json", "documents/industry/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["UP045"] # 保留现有 Optional 写法，升级运行时不要求机械重写旧代码。
